<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Home</title>
</head>
<body class="">
    <div id="tasks-container" class="flex">
        <!-- Side Panel -->
        <aside id="defaultSidePanel" class="w-80 bg-gray-100 shadow-lg fixed top-0 left-0 z-40 h-screen transition-transform -translate-x-full sm:translate-x-0">
            <div class="p-6">
                <h2 class="text-2xl font-bold text-gray-800">Private</h2>
                <div class="mt-4 overflow-y-auto">
                    <ul id="lists" class="space-y-2 font-medium">
                        <!-- List Items -->
                        <li class="group">
                            <a href="#" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">🏠</span><b>Home</b>
                                </span>
                                <span class="bg-gray-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="completed.html" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">✅</span><b>Completed</b>
                                </span>
                                <span id='completedTasksCount' class="bg-gray-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="personal.html" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">👤</span><b>Personal</b>
                                </span>
                                <span id='personalTasksCount' class="bg-gray-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">💻</span><b>Work</b>
                                </span>
                                <span class="bg-gray-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">✈️</span><b>Travel</b>
                                </span>
                                <span class="bg-gray-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">📚</span><b>Study</b>
                                </span>
                                <span class="bg-gray-500 text-white px-2 py-1 text-xs rounded-full">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">🏋️‍♂️</span><b>Workout</b>
                                </span>
                                <span class="bg-gray-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                            </a>
                        </li>
                        <li>
                            <a href="#" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                                <span class="flex items-center">
                                    <span class="mr-3">🥗</span><b>Diet</b>
                                </span>
                                <span class="bg-gray-500 text-white px-2 py-1 text-xs rounded-full">0</span>
                            </a>
                        </li>
                        

                        <!-- New List Input -->
                        <li class="mt-4">
                            <div class="relative">
                                <input id="new-list-input" class="w-full px-4 py-2 text-gray-700 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:border-blue-400" type="text" placeholder=" + New List">
                                <button id="add-new-list" class="absolute right-2 top-2 text-gray-600 hover:text-blue-500">➕</button>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>
    </div>

    <script>
        const listsContainer = document.getElementById('lists');
        const newListInput = document.getElementById('new-list-input');
        const addNewListButton = document.getElementById('add-new-list');

        addNewListButton.addEventListener('click', () => {
            const newListName = newListInput.value.trim();
            if (newListName) {
                const newListElement = document.createElement('li');
                newListElement.innerHTML = `
                    <a href="#" class="py-3 px-6 flex justify-between items-center rounded-lg hover:bg-gray-200 transition">
                        <span class="flex items-center">
                            <span class="mr-3">📝</span><b>${newListName}</b>
                        </span>
                        <span class="bg-gray-500 text-white px-2 py-1 rounded-full text-xs">0</span>
                    </a>
                `;
                listsContainer.appendChild(newListElement);
                newListInput.value = '';
            }
        });

        // Add "Enter" key functionality for new list input
        newListInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                addNewListButton.click();
            }
        });
    </script>
</body>
</html>
