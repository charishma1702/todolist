<!DOCTYPE html>
<html>
    <head>
        <title>Personal</title>
        </head>
        <body class="p-6">
            <h1 class="text-3xl font-bold">Personal Tasks</h1>
            <div id="taskContainer" class="mt-6 space-y-4"></div>

            <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const category = "Personal"; // Change this for different pages
                    const taskContainer = document.getElementById("taskContainer");
        
                    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        
                    // Filter tasks based on category
                    tasks.filter(task => task.category === category).forEach(task => {
                        const taskElement = document.createElement("div");
                        taskElement.classList.add("bg-white", "p-4", "rounded-lg", "shadow-md", "flex", "justify-between", "items-center");
        
                        taskElement.innerHTML = `
                            <div>
                                <h3 class="text-lg font-bold">${task.name}</h3>
                                <p class="text-sm text-gray-600">${task.date} | ${task.time} | Priority: <span class="font-semibold">${task.priority}</span></p>
                            </div>
                            <button class="px-3 py-1 bg-red-500 text-white rounded-md hover:bg-red-700 removeTaskBtn"></button>
                        `;
        
                        // Append to the container
                        taskContainer.appendChild(taskElement);
        
                        //  functionality
                        taskElement.querySelector(".removeTaskBtn").addEventListener("click", () => {
                            let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
                            tasks = tasks.filter(t => !(t.name === task.name && t.date === task.date));
                            localStorage.setItem("tasks", JSON.stringify(tasks));
                            taskElement.remove();
                        });
                    });
                });
            </script>
        </body>
        
</html>
