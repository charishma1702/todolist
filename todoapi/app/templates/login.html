
<!DOCTYPE html>
<html>
    <head>
        <title>TO-DO</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="login.js" defer></script>
    </head>
    <body>
        <div class="max-w-md mx-auto mt-10 LoginPage md:ml-auto">
            <form class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 animate-slide-in-right" id="login-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="username">Username</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" id="username" name="username" placeholder="username" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Password</label>
                    <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="password" id="password" name="password" placeholder="password" required>
                </div>
                <button class="bg-violet-500 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">Login</button>
                <div class="text-red-500 text-xs mt-2" id="error-message"></div>
                <p>Don't have an account?<a href="signup.html" class=""> SignUp</a></p>
            </form>
        </div>
        <script>
        function signin() {
            // Simulate login logic here (you can replace this with actual login check)
            const userAuthenticated = true; // Set this based on actual login validation
            
            if (userAuthenticated) {
              window.location.href = 'index.html'; // Redirect to dashboard if authenticated
            } else {
              alert("Invalid login. Please try again.");
            }
          }
        
        const form = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        
        form.addEventListener('submit', (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        if (username && password) {
            // Call API or perform login logic here
            console.log('Login successful');
            errorMessage.textContent = '';
        } else {errorMessage.textContent = 'Please fill in both username and password';}
        });
        
        // Add event listener to button click
        document.querySelector('button[type="submit"]').addEventListener('click', signin);
        </script>
        
    </body>
</html>
